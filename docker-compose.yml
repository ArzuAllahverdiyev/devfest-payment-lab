name: devfest-payment-lab

services:
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    hostname: kafka
    restart: unless-stopped

    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data

    volumes:
      - kafka_data:/var/lib/kafka/data

    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: paymentlab
      POSTGRES_USER: devfest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devfest -d paymentlab"]
      interval: 10s
      timeout: 5s
      retries: 10


  payment-api:
    ports:
      - "127.0.0.1:18081:8000"
    build:
      context: .
      dockerfile: services/payment-api/Dockerfile
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      POSTGRES_HOST: postgres
      POSTGRES_DB: paymentlab
      POSTGRES_USER: devfest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      kafka:
        condition: service_healthy


  payment-worker:
    build:
      context: .
      dockerfile: services/payment-worker/Dockerfile
    profiles: ["smoke"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      POSTGRES_HOST: postgres
      POSTGRES_DB: paymentlab
      POSTGRES_USER: devfest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      GATEWAY_URL: http://mock-gateway:8000
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mock-gateway:
        condition: service_started


  mock-gateway:
    build:
      context: .
      dockerfile: services/mock-gateway/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: paymentlab
      POSTGRES_USER: devfest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  kafka_data:
  postgres_data:
